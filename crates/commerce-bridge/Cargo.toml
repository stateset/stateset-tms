[package]
license = "MIT OR Apache-2.0"
name = "stateset-freight-commerce"
version = "0.2.3"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Typed, exact iCommerce boundaries for StateSet Freight"

[dependencies]
stateset-primitives = { path = "../../vendor/stateset-primitives", version = "=1.39.0" }
stateset-pricing = { path = "../../vendor/stateset-pricing", version = "=1.39.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
