[package]
license = "MIT OR Apache-2.0"
name = "stateset-freight"
version = "0.2.3"
edition = "2021"
rust-version = "1.90"
description = "StateSet freight operations API"

[workspace]
members = ["crates/storage-codec", "crates/freight-tui", "crates/commerce-bridge"]
exclude = ["vendor/stateset-primitives", "vendor/stateset-pricing", "vendor/sqlx-core", "integration-contracts", "runtime-contracts"]
resolver = "2"

# SQLx 0.8's webpki-roots 0.26 compatibility dependency is covered by
# RUSTSEC-2026-0381. Keep Rust 1.90 support while using the fixed 1.x bundle.
# Rust sources are unchanged; provenance and the dependency-only patch are
# recorded in vendor/sqlx-core/UPSTREAM.json.
[patch.crates-io]
sqlx-core = { path = "vendor/sqlx-core" }

[dependencies]
stateset-freight-commerce = { path = "crates/commerce-bridge" }
stateset-freight-storage-codec = { path = "crates/storage-codec" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
hmac = "0.12"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
hex = "0.4"
jsonwebtoken = { version = "9.3.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
seccompiler = { version = "=0.5.0", default-features = false }
landlock = "=0.4.7"
nix = { version = "=0.31.3", default-features = false, features = ["process", "user"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"

[profile.dev]
debug = 0

[profile.test]
debug = 0
