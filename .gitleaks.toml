# Retain every upstream detector. Exclusions apply only to the generic API-key
# rule, known SHA-256 fields, and evidence/catalog paths. No directory is skipped.
# Historical non-hash false positives are individually listed in .gitleaksignore.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Reviewed source/artifact SHA-256 metadata, not authentication keys"
